plugins {
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'java'
	id 'org.springframework.boot' version '3.3.7'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'jacoco'
}

import org.gradle.testing.jacoco.tasks.JacocoReport

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	
	// Spring Security
	implementation 'org.springframework.security:spring-security-config'
	implementation 'org.springframework.security:spring-security-web'
	implementation 'org.springframework.security:spring-security-messaging'
	
	// Spring Session
	implementation 'org.springframework.session:spring-session-data-redis'
	
	// MyBatis
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

	// .env 파일 로드 (로컬 개발용 - DB 자격증명 등)
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	
	// Jackson JSON
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	
	// STOMP
	implementation 'org.webjars:stomp-websocket:2.3.4'
	
	// Database
	runtimeOnly 'com.mysql:mysql-connector-j'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// SpringDoc OpenAPI (Swagger) 의존성
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
	
	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.security:spring-security-test'
}

sourceSets {
	test {
		java.srcDir '../sql/src/main/java'
	}
}

// JUnit 5 (Jupiter) 플랫폼 사용 — 없으면 JUnit4 러너라 Jupiter 테스트를 못 찾는다
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'mysql', 'redis'
	}
}

def requiredNonBlankEnvironment = { List<String> names, String taskName ->
	def missing = names.findAll { System.getenv(it) == null || System.getenv(it).isBlank() }
	if (!missing.isEmpty()) {
		throw new GradleException("${taskName} requires explicitly configured environment: ${missing.join(', ')}")
	}
}

tasks.register('mysqlIntegrationTest', Test) {
	group = 'verification'
	description = 'Runs MySQL integration tests against the explicitly configured dedicated server.'
	useJUnitPlatform { includeTags 'mysql' }
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	doFirst {
		requiredNonBlankEnvironment(['HARU_TEST_MYSQL_URL', 'HARU_TEST_MYSQL_USER'], name)
		if (System.getenv('HARU_TEST_MYSQL_PASSWORD') == null) {
			throw new GradleException('mysqlIntegrationTest requires HARU_TEST_MYSQL_PASSWORD to be present; an empty password is allowed')
		}
	}
}

tasks.register('redisIntegrationTest', Test) {
	group = 'verification'
	description = 'Runs Redis integration tests against the explicitly configured dedicated server.'
	useJUnitPlatform { includeTags 'redis' }
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	doFirst {
		requiredNonBlankEnvironment(['HARU_TEST_REDIS_HOST', 'HARU_TEST_REDIS_PORT'], name)
		try {
			Integer.parseInt(System.getenv('HARU_TEST_REDIS_PORT'))
		} catch (NumberFormatException exception) {
			throw new GradleException('HARU_TEST_REDIS_PORT must be an integer', exception)
		}
	}
}

tasks.named('mysqlIntegrationTest') {
	mustRunAfter tasks.named('test')
}

tasks.named('redisIntegrationTest') {
	mustRunAfter tasks.named('mysqlIntegrationTest')
}

tasks.register('jacocoIntegrationReport', JacocoReport) {
	group = 'verification'
	description = 'Runs test, MySQL, and Redis lanes in order and writes their combined JaCoCo report.'
	dependsOn tasks.named('test'), tasks.named('mysqlIntegrationTest'), tasks.named('redisIntegrationTest')
	executionData.from(['test', 'mysqlIntegrationTest', 'redisIntegrationTest'].collect { taskName ->
		tasks.named(taskName).map { it.jacoco.destinationFile }
	})
	sourceDirectories.from sourceSets.main.allSource.srcDirs
	classDirectories.from sourceSets.main.output
	reports {
		html.required = true
		xml.required = true
	}
}

// Gradle 8.12 has no failOnNoDiscoveredTests; guard both empty classes and empty discovery.
tasks.register('verifyTestClasses') {
	dependsOn tasks.named('testClasses')
	doLast {
		if (tasks.named('test').get().candidateClassFiles.isEmpty()) {
			throw new GradleException('No test classes found')
		}
	}
}

tasks.withType(Test).configureEach {
	systemProperty 'junit.jupiter.execution.timeout.default', '60 s'
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	afterSuite { suite, result ->
		if (suite.parent == null && result.testCount == 0) {
			throw new GradleException('No tests discovered')
		}
	}
}

tasks.named('test') {
	dependsOn tasks.named('verifyTestClasses')
	finalizedBy tasks.named('jacocoTestReport')
}

// A finalizer-only report still runs after failed tests.
tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.43
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.41
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Explicit classes only: never fall back to PIT's project-wide default.
pitest {
	pitestVersion = '1.22.1'
	junit5PluginVersion = '1.2.3'
	// Auto-detection ignores Spring Boot's BOM and selects an incompatible launcher.
	addJUnitPlatformLauncher = false
	targetClasses = providers.gradleProperty('pitTargetClasses').orElse('').map { raw ->
		def names = raw.split(',', -1).collect { it.trim() }
		if (names.any { !(it ==~ /[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)+/) }) {
			throw new GradleException('pitest requires -PpitTargetClasses=com.x.A,com.x.B (explicit class names)')
		}
		return names.collectMany { [it, it + '$*'] }
	}
	targetTests = ['*']
	excludedGroups = ['mysql', 'redis']
	threads = 2
	timeoutFactor = 2.0
	timeoutConstInMillis = 5000
	mutators = ['DEFAULTS']
	outputFormats = ['XML', 'HTML']
	timestampedReports = false
	reportDir = layout.buildDirectory.dir('reports/pitest')
	// Comment-only changes and classes with no mutable bytecode are valid inputs.
	failWhenNoMutations = false
	jvmArgs = ['-Djunit.jupiter.execution.timeout.default=60s']
}

tasks.named('pitest') {
	outputs.upToDateWhen { false }
}
