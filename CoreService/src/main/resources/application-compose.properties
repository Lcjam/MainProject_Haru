# Docker Compose(R04) 전용 프로파일. SPRING_PROFILES_ACTIVE=compose 일 때만 적용된다.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/haru_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}

# 독립 redis 서비스 (Core 이미지 안에서 Redis를 실행하지 않음). 비밀번호는 필수.
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# 컨테이너에는 .env 가 없으므로, 설정하지 않은 OAuth 시크릿이 플레이스홀더 문자열로 남지 않게 빈 값으로 둔다.
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
