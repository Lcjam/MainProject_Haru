# Docker Compose(R04) 전용 프로파일. SPRING_PROFILES_ACTIVE=compose 일 때만 적용된다.
# RouteConfig 의 prod 분기(core-container/assist-container/fastapi-container 네트워크 별칭)를 재사용한다.
# 환경변수 GATEWAY_PROFILE 이 있으면 그 값이 우선한다.
GATEWAY_PROFILE=prod

# 운영 프로파일에서는 application.properties의 로컬 개발용 기본 secret을 허용하지 않는다.
jwt.secret=${JWT_SECRET}
